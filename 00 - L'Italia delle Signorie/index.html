:root{color-scheme:dark;--bg:#17171a;--fg:#ececec;--card:#222226;--bd:#3a3a40;--ac:#e8a48f;--mut:#aaa}

</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>00 - L&#x27;Italia delle Signorie</h1><h2>Immagini</h2><div class='grid'><figure><a href='01%20-%20Signorie%20in%20Italia.jpg'><img loading='lazy' src='01%20-%20Signorie%20in%20Italia.jpg' alt='Signorie in Italia'></a><figcaption>Signorie in Italia</figcaption></figure><figure><a href='02%20-%20Italia%20dopo%20pace%20di%20Lodi.png'><img loading='lazy' src='02%20-%20Italia%20dopo%20pace%20di%20Lodi.png' alt='Italia dopo pace di Lodi'></a><figcaption>Italia dopo pace di Lodi</figcaption></figure><figure><a href='03%20-%20Casate%20italiane%20nel%201499.png'><img loading='lazy' src='03%20-%20Casate%20italiane%20nel%201499.png' alt='Casate italiane nel 1499'></a><figcaption>Casate italiane nel 1499</figcaption></figure><figure><a href='David%20%28Donatello%29.jpg'><img loading='lazy' src='David%20%28Donatello%29.jpg' alt='David (Donatello)'></a><figcaption>David (Donatello)</figcaption></figure><figure><a href='La%20Creazione%20di%20Adamo%20%28Michelangelo%29.jpg'><img loading='lazy' src='La%20Creazione%20di%20Adamo%20%28Michelangelo%29.jpg' alt='La Creazione di Adamo (Michelangelo)'></a><figcaption>La Creazione di Adamo (Michelangelo)</figcaption></figure><figure><a href='La%20Gioconda%20%28Leonardo%20da%20Vinci%29.jpg'><img loading='lazy' src='La%20Gioconda%20%28Leonardo%20da%20Vinci%29.jpg' alt='La Gioconda (Leonardo da Vinci)'></a><figcaption>La Gioconda (Leonardo da Vinci)</figcaption></figure><figure><a href='La%20Piet%C3%A0%20%28Michelangelo%29.jpg'><img loading='lazy' src='La%20Piet%C3%A0%20%28Michelangelo%29.jpg' alt='La Pietà (Michelangelo)'></a><figcaption>La Pietà (Michelangelo)</figcaption></figure><figure><a href='Mos%C3%A8%20%28Michelangelo%29.jpg'><img loading='lazy' src='Mos%C3%A8%20%28Michelangelo%29.jpg' alt='Mosè (Michelangelo)'></a><figcaption>Mosè (Michelangelo)</figcaption></figure><figure><a href='Nascita%20di%20Venere%20%28Botticelli%29.jpg'><img loading='lazy' src='Nascita%20di%20Venere%20%28Botticelli%29.jpg' alt='Nascita di Venere (Botticelli)'></a><figcaption>Nascita di Venere (Botticelli)</figcaption></figure><figure><a href='Stampa%20a%20caratteri%20mobili.jpg'><img loading='lazy' src='Stampa%20a%20caratteri%20mobili.jpg' alt='Stampa a caratteri mobili'></a><figcaption>Stampa a caratteri mobili</figcaption></figure><figure><a href='Ultima%20cena%20%28Leonardo%20da%20Vinci%29.jpg'><img loading='lazy' src='Ultima%20cena%20%28Leonardo%20da%20Vinci%29.jpg' alt='Ultima cena (Leonardo da Vinci)'></a><figcaption>Ultima cena (Leonardo da Vinci)</figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:84vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.7rem;font-size:.95rem;text-align:center;padding:0 3rem}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='Escape')close()});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}

</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>01 - L&#x27;impero turco-ottomano e la scoperta di nuovi mondi</h1><h2>Immagini</h2><div class='grid'><figure><a href='00%20-%20Espansione%20impero%20ottomano.jpg'><img loading='lazy' src='00%20-%20Espansione%20impero%20ottomano.jpg' alt='Espansione impero ottomano'></a><figcaption>Espansione impero ottomano</figcaption></figure><figure><a href='01%20-%20Mappa%20Costantinopoli.jpg'><img loading='lazy' src='01%20-%20Mappa%20Costantinopoli.jpg' alt='Mappa Costantinopoli'></a><figcaption>Mappa Costantinopoli</figcaption></figure><figure><a href='02%20-%20Assedio%20Costantinopoli%20%281453%29.jpg'><img loading='lazy' src='02%20-%20Assedio%20Costantinopoli%20%281453%29.jpg' alt='Assedio Costantinopoli (1453)'></a><figcaption>Assedio Costantinopoli (1453)</figcaption></figure><figure><a href='03%20-%20Termoli.%20Incendio%20del%20castello%20%281566%29.jpg'><img loading='lazy' src='03%20-%20Termoli.%20Incendio%20del%20castello%20%281566%29.jpg' alt='Termoli. Incendio del castello (1566)'></a><figcaption>Termoli. Incendio del castello (1566)</figcaption></figure><figure><a href='05%20-%20Via%20della%20Seta.jpg'><img loading='lazy' src='05%20-%20Via%20della%20Seta.jpg' alt='Via della Seta'></a><figcaption>Via della Seta</figcaption></figure><figure><a href='06%20-%20Mappa%20del%20mondo.%20Medioevo.jpg'><img loading='lazy' src='06%20-%20Mappa%20del%20mondo.%20Medioevo.jpg' alt='Mappa del mondo. Medioevo'></a><figcaption>Mappa del mondo. Medioevo</figcaption></figure><figure><a href='07%20-%20Diaz.%20Capo%20di%20Buona%20Speranza%20%281488%29.jpg'><img loading='lazy' src='07%20-%20Diaz.%20Capo%20di%20Buona%20Speranza%20%281488%29.jpg' alt='Diaz. Capo di Buona Speranza (1488)'></a><figcaption>Diaz. Capo di Buona Speranza (1488)</figcaption></figure><figure><a href='08%20-%20Nina%2C%20Pinta%20e%20Santa%20Maria%20%281492%29.jpg'><img loading='lazy' src='08%20-%20Nina%2C%20Pinta%20e%20Santa%20Maria%20%281492%29.jpg' alt='Nina, Pinta e Santa Maria (1492)'></a><figcaption>Nina, Pinta e Santa Maria (1492)</figcaption></figure><figure><a href='10%20-%20Primo%20viaggio%20di%20Colombo.png'><img loading='lazy' src='10%20-%20Primo%20viaggio%20di%20Colombo.png' alt='Primo viaggio di Colombo'></a><figcaption>Primo viaggio di Colombo</figcaption></figure><figure><a href='11%20-%20Mappa%20venti%20alisei.jpg'><img loading='lazy' src='11%20-%20Mappa%20venti%20alisei.jpg' alt='Mappa venti alisei'></a><figcaption>Mappa venti alisei</figcaption></figure><figure><a href='12%20-%20Viaggi%20Colombo.png'><img loading='lazy' src='12%20-%20Viaggi%20Colombo.png' alt='Viaggi Colombo'></a><figcaption>Viaggi Colombo</figcaption></figure><figure><a href='13%20-%20Viaggi%20Colombo%20%282%29.jpg'><img loading='lazy' src='13%20-%20Viaggi%20Colombo%20%282%29.jpg' alt='Viaggi Colombo (2)'></a><figcaption>Viaggi Colombo (2)</figcaption></figure><figure><a href='14%20-%20Colombo%20incontra%20indigeni.jpg'><img loading='lazy' src='14%20-%20Colombo%20incontra%20indigeni.jpg' alt='Colombo incontra indigeni'></a><figcaption>Colombo incontra indigeni</figcaption></figure><figure><a href='15%20-%20Testimonianza%20Cristoforo%20Colombo%20e%20Indigeni.jpg'><img loading='lazy' src='15%20-%20Testimonianza%20Cristoforo%20Colombo%20e%20Indigeni.jpg' alt='Testimonianza Cristoforo Colombo e Indigeni'></a><figcaption>Testimonianza Cristoforo Colombo e Indigeni</figcaption></figure><figure><a href='16%20-%20Viaggio%20Vasco%20da%20Gama%20%281498%29.jpg'><img loading='lazy' src='16%20-%20Viaggio%20Vasco%20da%20Gama%20%281498%29.jpg' alt='Viaggio Vasco da Gama (1498)'></a><figcaption>Viaggio Vasco da Gama (1498)</figcaption></figure><figure><a href='17%20-%20Viaggio%20Magellano%20%281519%29.jpg'><img loading='lazy' src='17%20-%20Viaggio%20Magellano%20%281519%29.jpg' alt='Viaggio Magellano (1519)'></a><figcaption>Viaggio Magellano (1519)</figcaption></figure><figure><a href='18%20-%20Trattato%20di%20Tordesillas%20%281494%29.jpg'><img loading='lazy' src='18%20-%20Trattato%20di%20Tordesillas%20%281494%29.jpg' alt='Trattato di Tordesillas (1494)'></a><figcaption>Trattato di Tordesillas (1494)</figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:86vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.4rem;font-size:.9rem;text-align:center;padding:0 3rem}
#lb .dsc{position:absolute;left:50%;bottom:4.2rem;transform:translateX(-50%);width:min(92vw,760px);max-height:55vh;overflow:auto;background:#111f;border:1px solid #666;border-radius:10px;color:#e6e6e6;font-size:1rem;line-height:1.5;padding:1rem 1.2rem;display:none;box-shadow:0 8px 30px #000}
#lb .dsc.on{display:block}
#lb .ctx{left:.6rem;top:.6rem;width:auto;height:auto;font-size:.95rem;padding:.55rem .9rem;display:none}
#lb .ctx.on{display:block}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="ctx">Contesto</button><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="dsc"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),ds=lb.querySelector('.dsc'),cx=lb.querySelector('.ctx'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;var d=L[i].parentNode.getAttribute('data-desc')||'';ds.textContent=d;ds.classList.remove('on');cx.classList.toggle('on',!!d);cx.textContent='Contesto';ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
function tg(){var o=ds.classList.toggle('on');cx.textContent=o?'Nascondi contesto':'Contesto'}
cx.onclick=function(e){e.stopPropagation();tg()};ds.onclick=function(e){e.stopPropagation();tg()};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if((e.key==='c'||e.key==='C')&&cx.classList.contains('on'))tg();else if(e.key==='Escape'){if(ds.classList.contains('on'))tg();else close()}});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>

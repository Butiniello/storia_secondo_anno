<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>04 - La Riforma protestante – Storia</title><style>
:root{color-scheme:dark;--bg:#17171a;--fg:#ececec;--card:#222226;--bd:#3a3a40;--ac:#e8a48f;--mut:#aaa}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
main{max-width:920px;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-size:2rem;margin:.2rem 0 .3rem}h2{margin-top:2rem;border-bottom:1px solid var(--bd);padding-bottom:.3rem}
h3{font-size:1rem;margin:.6rem 0 .3rem;font-weight:600}

a{color:var(--ac)}
.cards{display:grid;gap:.9rem;margin-top:1.2rem}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.1rem 1.3rem;text-decoration:none;color:var(--fg);font-size:1.15rem}
a.card:hover{border-color:var(--ac)}a.card small{display:block;color:var(--mut);font-size:.9rem;margin-top:.2rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.grid figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.6rem}
.grid img{width:100%;height:190px;object-fit:contain;background:#0001;border-radius:6px}
.grid figcaption{font-size:.9rem;margin-top:.4rem}
</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>04 - La Riforma protestante</h1><h2>Immagini</h2><div class='grid'><figure><a href='00%20-%20Ritratto%20di%20Martin%20Lutero%20%28Cranach%20il%20Vecchio%2C%201529%29.jpg'><img loading='lazy' src='00%20-%20Ritratto%20di%20Martin%20Lutero%20%28Cranach%20il%20Vecchio%2C%201529%29.jpg' alt='Ritratto di Martin Lutero (Cranach il Vecchio, 1529)'></a><figcaption>Ritratto di Martin Lutero (Cranach il Vecchio, 1529)</figcaption></figure><figure><a href='01%20-%20Papa%20Leone%20X%20%28Raffaello%201518%29.jpg'><img loading='lazy' src='01%20-%20Papa%20Leone%20X%20%28Raffaello%201518%29.jpg' alt='Papa Leone X (Raffaello 1518)'></a><figcaption>Papa Leone X (Raffaello 1518)</figcaption></figure><figure><a href='02%20-%20Il%20Diavolo%20vende%20le%20indulgenze.png'><img loading='lazy' src='02%20-%20Il%20Diavolo%20vende%20le%20indulgenze.png' alt='Il Diavolo vende le indulgenze'></a><figcaption>Il Diavolo vende le indulgenze</figcaption></figure><figure><a href='03%20-%2095%20tesi%20Lutero%20%28Wittenberg%201517%29.jpg'><img loading='lazy' src='03%20-%2095%20tesi%20Lutero%20%28Wittenberg%201517%29.jpg' alt='95 tesi Lutero (Wittenberg 1517)'></a><figcaption>95 tesi Lutero (Wittenberg 1517)</figcaption></figure><figure><a href='04%20-%20Satira%20contro%20il%20papa.jpg'><img loading='lazy' src='04%20-%20Satira%20contro%20il%20papa.jpg' alt='Satira contro il papa'></a><figcaption>Satira contro il papa</figcaption></figure><figure data-desc='Lettera con cui l&#x27;imperatore Carlo V convoca Martin Lutero alla Dieta di Worms, datata 6 marzo 1521. A questa lettera era unito un salvacondotto, che garantiva a Lutero un viaggio sicuro, di andata e ritorno, per presentarsi davanti all&#x27;imperatore e agli Stati dell&#x27;Impero e rispondere sulla sua dottrina e sui suoi scritti. Il documento è in tedesco cinquecentesco, con grafia da cancelleria.

Traduzione in italiano (bozza: l&#x27;immagine è a bassa risoluzione, le parti incerte sono in [parentesi quadre]).
Indirizzo (a margine): «All&#x27;onorevole, a noi caro devoto, dottor Martin Lutero, dell&#x27;Ordine degli Agostiniani».
Testo: «Carlo, per grazia di Dio eletto imperatore dei Romani, sempre accrescitore dell&#x27;Impero, ecc. Onorevole, caro devoto, poiché noi e gli Stati del Sacro Impero, qui ora riuniti, abbiamo stabilito e deciso, riguardo alla dottrina e ai libri [da te] pubblicati, di ricevere da te un&#x27;informazione, ti abbiamo concesso, per venire qui e tornare poi a casa, la nostra e dell&#x27;Impero piena e diretta protezione e salvacondotto, che con la presente ti inviamo. [Ti chiediamo] di metterti in viaggio in particolare, così che entro ventuno giorni [dalla data di questa lettera] tu sia qui presso di noi, senza temere alcuna violenza o ingiustizia; [e che tu] faccia affidamento sul nostro salvacondotto e [su di esso] ti fidi, con la nostra seria intenzione [di mantenerlo]. Dato a Worms, il sesto giorno del mese di marzo, nell&#x27;anno [1521], del nostro Impero il secondo.»
Firme: «Carolus» (l&#x27;imperatore); «Per ordine proprio dell&#x27;Imperatore: Alberto, cardinale [arcivescovo di Magonza, arcicancelliere]»; Nikolaus Ziegler (segretario imperiale; la firma è poco leggibile).

Da verificare: la traduzione è mia, ricostruita dall&#x27;immagine (poco leggibile); non ho trovato online una traduzione italiana affidabile. Il contenuto generale (21 giorni, nessuna violenza o ingiustizia da temere, firme di Carlo, del cardinale Alberto di Magonza e di Ziegler) è confermato da J.-H. Merle d&#x27;Aubigné, Storia della Riforma, libro VII, cap. 5. Il testo originale critico è in D. Martin Luthers Werke, Briefwechsel, vol. 2, pp. 278-287.'><a href='05%20-%20Lutero%20convocato%20alla%20Dieta%20di%20Worms.jpg'><img loading='lazy' src='05%20-%20Lutero%20convocato%20alla%20Dieta%20di%20Worms.jpg' alt='Lutero convocato alla Dieta di Worms'></a><figcaption>Lutero convocato alla Dieta di Worms</figcaption></figure><figure><a href='06%20-%20Lutero%20alla%20Dieta%20di%20Worms%20%281521%29.jpg'><img loading='lazy' src='06%20-%20Lutero%20alla%20Dieta%20di%20Worms%20%281521%29.jpg' alt='Lutero alla Dieta di Worms (1521)'></a><figcaption>Lutero alla Dieta di Worms (1521)</figcaption></figure><figure><a href='07%20-%20Lutero%20alla%20Dieta%20di%20Worms%20%281521%29.png'><img loading='lazy' src='07%20-%20Lutero%20alla%20Dieta%20di%20Worms%20%281521%29.png' alt='Lutero alla Dieta di Worms (1521)'></a><figcaption>Lutero alla Dieta di Worms (1521)</figcaption></figure><figure><a href='08%20-%20Diffusione%20Luteranesimo.png'><img loading='lazy' src='08%20-%20Diffusione%20Luteranesimo.png' alt='Diffusione Luteranesimo'></a><figcaption>Diffusione Luteranesimo</figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:#000;display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:86vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.4rem;font-size:.9rem;text-align:center;padding:0 3rem}
#lb .dsc{position:absolute;left:50%;bottom:4.2rem;transform:translateX(-50%);width:min(92vw,760px);max-height:55vh;overflow:auto;background:#111f;border:1px solid #666;border-radius:10px;color:#e6e6e6;font-size:1rem;line-height:1.5;padding:1rem 1.2rem;display:none;box-shadow:0 8px 30px #000}
#lb .dsc.on{display:block}
@media(min-width:801px){#lb.side{padding-right:370px}#lb.side img{max-width:calc(100vw - 420px)}#lb .dsc{left:auto;right:1rem;bottom:auto;top:4.5rem;transform:none;width:340px;max-height:calc(100vh - 9rem);font-size:1.02rem}}
#lb .ctx{left:.6rem;top:.6rem;width:auto;height:auto;font-size:.95rem;padding:.55rem .9rem;display:none}
#lb .ctx.on{display:block}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="ctx">Contesto</button><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="dsc"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),ds=lb.querySelector('.dsc'),cx=lb.querySelector('.ctx'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;var d=L[i].parentNode.getAttribute('data-desc')||'';ds.textContent=d;ds.classList.remove('on');lb.classList.remove('side');cx.classList.toggle('on',!!d);cx.textContent='Contesto';ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');lb.classList.remove('side');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
function tg(){var o=ds.classList.toggle('on');lb.classList.toggle('side',o);cx.textContent=o?'Nascondi contesto':'Contesto'}
cx.onclick=function(e){e.stopPropagation();tg()};ds.onclick=function(e){e.stopPropagation();tg()};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if((e.key==='c'||e.key==='C')&&cx.classList.contains('on'))tg();else if(e.key==='Escape'){if(ds.classList.contains('on'))tg();else close()}});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>

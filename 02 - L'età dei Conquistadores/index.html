:root{color-scheme:dark;--bg:#17171a;--fg:#ececec;--card:#222226;--bd:#3a3a40;--ac:#e8a48f;--mut:#aaa}

.cards{display:grid;gap:.9rem;margin-top:1.2rem}

</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>02 - L&#x27;età dei Conquistadores</h1><h2>Immagini</h2><div class='grid'><figure><a href='01%20-%20Claude%20Bernou.%20Mappa%20America%20%281681%29.jpg'><img loading='lazy' src='01%20-%20Claude%20Bernou.%20Mappa%20America%20%281681%29.jpg' alt='Claude Bernou. Mappa America (1681)'></a><figcaption>Claude Bernou. Mappa America (1681)</figcaption></figure><figure><a href='02%20-%20Trattato%20di%20Tordesillas%20%281494%29.jpg'><img loading='lazy' src='02%20-%20Trattato%20di%20Tordesillas%20%281494%29.jpg' alt='Trattato di Tordesillas (1494)'></a><figcaption>Trattato di Tordesillas (1494)</figcaption></figure><figure><a href='03%20-%20Il%20Nuovo%20Mondo%20nel%20XVI%20secolo.jpg'><img loading='lazy' src='03%20-%20Il%20Nuovo%20Mondo%20nel%20XVI%20secolo.jpg' alt='Il Nuovo Mondo nel XVI secolo'></a><figcaption>Il Nuovo Mondo nel XVI secolo</figcaption></figure><figure><a href='04%20-%20Conquista%20e%20colonizzazione.jpg'><img loading='lazy' src='04%20-%20Conquista%20e%20colonizzazione.jpg' alt='Conquista e colonizzazione'></a><figcaption>Conquista e colonizzazione</figcaption></figure><figure><a href='05%20-%20Mappa%20Tenochtitlan%2C%20cpaitale%20impero%20azteco%20%281524%29.jpg'><img loading='lazy' src='05%20-%20Mappa%20Tenochtitlan%2C%20cpaitale%20impero%20azteco%20%281524%29.jpg' alt='Mappa Tenochtitlan, cpaitale impero azteco (1524)'></a><figcaption>Mappa Tenochtitlan, cpaitale impero azteco (1524)</figcaption></figure><figure><a href='06%20-%20Tenochtlitlan.jpg'><img loading='lazy' src='06%20-%20Tenochtlitlan.jpg' alt='Tenochtlitlan'></a><figcaption>Tenochtlitlan</figcaption></figure><figure><a href='07%20-%20Conquistadores%20prima%20di%20entrare%20a%20Tenochtitlan.jpg'><img loading='lazy' src='07%20-%20Conquistadores%20prima%20di%20entrare%20a%20Tenochtitlan.jpg' alt='Conquistadores prima di entrare a Tenochtitlan'></a><figcaption>Conquistadores prima di entrare a Tenochtitlan</figcaption></figure><figure><a href='08%20-%20Sacrificio%20umano%202.jpg'><img loading='lazy' src='08%20-%20Sacrificio%20umano%202.jpg' alt='Sacrificio umano 2'></a><figcaption>Sacrificio umano 2</figcaption></figure><figure><a href='08%20-%20Sacrificio%20umano.jpg'><img loading='lazy' src='08%20-%20Sacrificio%20umano.jpg' alt='Sacrificio umano'></a><figcaption>Sacrificio umano</figcaption></figure><figure><a href='09%20-%20Cortes%20guida%20rivolta%20aztechi.jpg'><img loading='lazy' src='09%20-%20Cortes%20guida%20rivolta%20aztechi.jpg' alt='Cortes guida rivolta aztechi'></a><figcaption>Cortes guida rivolta aztechi</figcaption></figure><figure><a href='09%20-%20Quetzalc%C3%B2atl.jpg'><img loading='lazy' src='09%20-%20Quetzalc%C3%B2atl.jpg' alt='Quetzalcòatl'></a><figcaption>Quetzalcòatl</figcaption></figure><figure><a href='10%20-%20Machu%20Picchu%2C%20impero%20Inca.jpg'><img loading='lazy' src='10%20-%20Machu%20Picchu%2C%20impero%20Inca.jpg' alt='Machu Picchu, impero Inca'></a><figcaption>Machu Picchu, impero Inca</figcaption></figure><figure><a href='11%20-%20Importazioni%20da%20America%20.jpg'><img loading='lazy' src='11%20-%20Importazioni%20da%20America%20.jpg' alt='Importazioni da America '></a><figcaption>Importazioni da America </figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:72vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.7rem;font-size:.95rem;text-align:center;padding:0 3rem}
#lb .dsc{color:#d8d8d8;font-size:.9rem;line-height:1.45;max-width:820px;max-height:14vh;overflow:auto;margin-top:.4rem;padding:0 3.2rem;text-align:left}
#lb .dsc:empty{display:none}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="dsc"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),ds=lb.querySelector('.dsc'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;ds.textContent=L[i].parentNode.getAttribute('data-desc')||'';ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='Escape')close()});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>
